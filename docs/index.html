<!doctype html>
<html lang="ko">
<head>

<body>
<header class="top">

  <label class="hide"><input type="checkbox" id="hideAns"> 답 가리기</label>
</header>
<main id="out"><p class="msg">교재에 인쇄된 쪽 번호를 입력하세요.</p></main>
<footer class="foot">풀이는 직접 작성한 것으로, 교재 해설과 다를 수 있습니다.</footer>
